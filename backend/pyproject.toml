[project]
name = "stockmaster-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "Flask==3.1.3",
  "Flask-SQLAlchemy==3.1.1",
  "Flask-Migrate==4.0.7",
  "Flask-JWT-Extended==4.6.0",
  "Flask-Cors==6.0.5",
  "Flask-Limiter==3.8.0",
  "psycopg[binary,pool]==3.3.6",
  "pydantic==2.13.5",
  "python-dotenv==1.2.3",
  "gunicorn==22.0.0",
  "bcrypt==4.2.0",
  "tzdata==2026.4",
  "openpyxl==3.1.5",
  "defusedxml==0.7.1",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.8",
  "pyright[nodejs]==1.1.414",
  "squawk-cli==2.65.0",
]

[tool.uv]
package = false
exclude-newer = "1 day"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = [
  "E", "W",
  "F",
  "I",
  "B",
  "UP",
  "SIM",
  "S",
  "DTZ",
]

ignore = [
  "UP042",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pyright]
include = ["app", "tests", "wsgi.py"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 94
show_missing = true
skip_covered = true