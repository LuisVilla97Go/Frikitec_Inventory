<div class="min-h-screen bg-brand-bgSecondary flex flex-col justify-center py-12 sm:px-6 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-md flex flex-col items-center">
    <img ngSrc="/logo-frikitec-negro.png" width="1561" height="259" priority alt="Frikitec Logo" class="w-full max-w-md h-auto mb-6">
    <h2 class="text-center text-3xl font-extrabold text-brand-dark">
      StockMaster
    </h2>
    <p class="mt-2 text-center text-sm text-gray-600">
      Panel de Control de Inventario
    </p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-white py-8 px-4 shadow sm:rounded-lg sm:px-10 border border-gray-100">
      
      <!-- Errores de Servidor -->
      @if (serverError()) {
        <div class="mb-4 rounded-md bg-red-50 p-4 border border-brand-error">
          <div class="flex">
            <svg aria-hidden="true" [lucideIcon]="AlertCircle" class="h-5 w-5 text-brand-error"></svg>
            <div class="ml-3">
              <h3 class="text-sm font-medium text-brand-error">{{ serverError() }}</h3>
            </div>
          </div>
        </div>
      }

      <!-- Errores de Valibot -->
      @if (validationErrors().length > 0) {
        <div class="mb-4 rounded-md bg-orange-50 p-4 border border-orange-200">
          <ul class="list-disc pl-5 space-y-1">
            @for (error of validationErrors(); track error) {
              <li class="text-sm text-orange-700">{{ error }}</li>
            }
          </ul>
        </div>
      }

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
        
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700">Usuario o Correo</label>
          <div class="mt-1 relative rounded-md shadow-sm">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg aria-hidden="true" [lucideIcon]="User" class="h-5 w-5 text-gray-400"></svg>
            </div>
            <input id="email" type="text" formControlName="email"
              class="focus:ring-brand-primary focus:border-brand-primary block w-full pl-10 sm:text-sm border-gray-300 rounded-md py-2 px-3 border"
              placeholder="ejemplo@frikitec.com">
          </div>
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-gray-700">Contraseña</label>
          <div class="mt-1 relative rounded-md shadow-sm">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg aria-hidden="true" [lucideIcon]="Lock" class="h-5 w-5 text-gray-400"></svg>
            </div>
            <input id="password" [type]="showPassword() ? 'text' : 'password'" formControlName="password"
              class="focus:ring-brand-primary focus:border-brand-primary block w-full pl-10 sm:text-sm border-gray-300 rounded-md py-2 px-3 border"
              placeholder="••••••••">
            <button type="button" class="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer" (click)="togglePassword()"
              [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'">
              <svg aria-hidden="true" [lucideIcon]="showPassword() ? EyeOff : Eye" class="h-5 w-5 text-gray-400 hover:text-gray-600"></svg>
            </button>
          </div>
        </div>

        <div>
          <button type="submit" [disabled]="loginMutation.isPending()"
            class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-brand-primaryDark hover:bg-orange-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-primary disabled:opacity-50 transition-colors">
            @if (loginMutation.isPending()) {
              Iniciando Sesión...
            } @else {
              Ingresar al Sistema
            }
          </button>
        </div>
      </form>

    </div>
    <app-licencias />
  </div>
</div>
