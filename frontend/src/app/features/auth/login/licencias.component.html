<p class="mt-4 text-center text-sm text-gray-600">
  <button
    type="button"
    (click)="abrir()"
    class="underline underline-offset-4 hover:text-brand-primaryDark focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-brand-primaryDark"
  >
    Licencias y avisos de terceros
  </button>
</p>

<dialog
  #dialogo
  aria-labelledby="titulo-licencias"
  class="w-[calc(100%_-_2rem)] max-w-4xl max-h-[85dvh] rounded-xl border border-brand-border bg-white p-0 text-gray-700 shadow-xl backdrop:bg-black/50"
>
  <div
    class="sticky top-0 flex items-start justify-between gap-4 border-b border-brand-border bg-white p-4 sm:p-6"
  >
    <h2
      id="titulo-licencias"
      class="text-lg font-semibold text-brand-dark sm:text-xl"
    >
      Licencias y avisos de terceros
    </h2>
    <button
      type="button"
      (click)="dialogo.close()"
      class="shrink-0 rounded-md border border-brand-border px-3 py-2 text-sm font-medium hover:bg-gray-50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-brand-primaryDark"
    >
      Cerrar
    </button>
  </div>
  <div class="p-4 sm:p-6">
    @if (cargando()) {
      <p role="status">Cargando los avisos completos…</p>
    } @else if (error()) {
      <p role="alert" class="text-red-700">
        No se pudieron cargar todos los avisos. Inténtalo de nuevo.
      </p>
      <button
        type="button"
        (click)="cargar()"
        class="mt-4 rounded-md bg-brand-primaryDark px-4 py-2 text-sm font-medium text-white hover:bg-orange-800"
      >
        Reintentar
      </button>
    } @else {
      <pre
        class="whitespace-pre-wrap break-words font-mono text-xs leading-relaxed sm:text-sm"
        >{{ texto() }}</pre
      >
    }
  </div>
</dialog>
