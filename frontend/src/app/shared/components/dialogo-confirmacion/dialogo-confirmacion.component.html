<dialog
  #dialogo
  [attr.aria-label]="titulo()"
  aria-describedby="mensaje-confirmacion"
  (cancel)="pedirCancelacion($event)"
  (keydown)="recorrerFoco($event)"
  class="fixed inset-0 m-auto h-fit w-[calc(100%-2rem)] max-w-md rounded-2xl border border-brand-border bg-white p-7 text-center shadow-2xl backdrop:bg-slate-900/50 backdrop:backdrop-blur-sm"
>
  <div
    class="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-full"
    [class.bg-rose-50]="peligro()"
    [class.text-rose-600]="peligro()"
    [class.bg-emerald-50]="!peligro()"
    [class.text-emerald-700]="!peligro()"
  >
    <svg aria-hidden="true" [lucideIcon]="icono()" class="h-8 w-8"></svg>
  </div>
  <h3 class="text-xl font-bold text-brand-dark">{{ titulo() }}</h3>
  <p id="mensaje-confirmacion" class="mt-3 text-sm leading-6 text-slate-600">
    {{ mensaje() }}
  </p>
  <div class="mt-7 flex justify-center gap-3">
    <button
      type="button"
      (click)="pedirCancelacion()"
      [disabled]="ocupado()"
      class="min-h-11 rounded-xl border border-slate-300 bg-slate-50 px-5 py-2.5 text-sm font-semibold text-slate-700 transition-colors hover:bg-slate-100 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-primaryDark disabled:opacity-50"
    >
      Cancelar
    </button>
    <button
      type="button"
      (click)="pedirConfirmacion()"
      [disabled]="ocupado()"
      class="min-h-11 rounded-xl px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-primaryDark disabled:opacity-50"
      [class.bg-rose-600]="peligro()"
      [class.hover:bg-rose-700]="peligro()"
      [class.bg-brand-primaryDark]="!peligro()"
      [class.hover:bg-orange-800]="!peligro()"
    >
      {{ ocupado() ? "Procesando…" : textoConfirmar() }}
    </button>
  </div>
</dialog>
